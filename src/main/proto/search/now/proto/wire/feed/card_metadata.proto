syntax = "proto2";

import "src/main/proto/search/now/proto/ui/piet/piet.proto";
import "src/main/proto/search/now/proto/wire/feed/content_id.proto";
import "src/main/proto/search/now/proto/wire/feed/feature.proto";

package search.now.proto.wire.feed;

option optimize_for=LITE_RUNTIME;

option java_package = "com.google.search.now.wire.feed";
option java_outer_classname = "CardMetadataProto";

// This proto defines some samples of Metadata that are defined as part of
// the stream.  These are not real, the are _only_ examples.
//
// NOTE: This actually shouldn't be part of the wire protocol.  It should be
// pulled out into a separate package because it's created outside of the
// wire protocol and is used on clients outside of the processing of the
// wire protocol.

// This is the Metadata which defines the look and feel of the card along
// with the content.
message CardMetadata {

  extend Feature {
    optional CardMetadata card_metadata = 1000;
  }

  // TODO: Support for other renderer representations?
  // Piet UI representation
  optional search.now.ui.piet.Frame piet_frame_ui = 1;

  // The Piet shared states which are used by the Card.
  repeated ContentId piet_shared_states = 2;
}
